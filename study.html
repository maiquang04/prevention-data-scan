<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Draft: reachable by link, kept out of search results. Remove when it is finished. -->
<meta name="robots" content="noindex">
<title>Source - Prevention data scan</title>
<link rel="stylesheet" href="assets/style.css?v=6c420df3">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="site-head__inner">
    <a class="site-head__title" href="index.html">Prevention data scan <span>&middot; working draft</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Overview</a>
      <a href="application.html?app=1" data-grid-nav>Topic view</a>
      <a href="browse.html">Browse sources</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap wrap--text" id="study-main">
    <p class="crumb" id="crumb"><a href="index.html">Overview</a> &rsaquo;
      <a href="browse.html">Browse sources</a></p>
    <div id="record"><p class="loading">Loading&hellip;</p></div>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>Working draft &middot; data last updated <span data-generated>&mdash;</span>.</p>
  </div>
</footer>

<script src="assets/common.js?v=d33add98"></script>
<script>
(function () {
  "use strict";
  var S = window.scan;

  function row(term, value) {
    if (!value) return "";
    return "<dt>" + S.escapeHtml(term) + "</dt><dd>" + value + "</dd>";
  }

  S.loadData(["studies.json", "meta.json"]).then(function (loaded) {
    var studies = loaded[0], meta = loaded[1];
    S.setTopics(meta.topics);
    S.stampGenerated(meta);

    var wanted = S.param("id");
    var study = null;
    studies.forEach(function (s) { if (s.id === wanted) study = s; });

    if (!study) {
      document.getElementById("record").innerHTML =
        '<div class="error"><p><b>That source link does not match anything in the scan.</b></p>' +
        '<p>Try the <a href="browse.html">browse page</a>.</p></div>';
      return;
    }

    var topicNames = study.topics.map(S.topicTitle).join(", ");
    document.title = topicNames + " source " + study.num + " - Prevention data scan";
    // A source can carry more than one topic, so the breadcrumb names none of them
    // specifically - the Topics row below links to each.
    document.getElementById("crumb").innerHTML =
      '<a href="index.html">Overview</a> &rsaquo; ' +
      '<a href="browse.html">Browse sources</a> &rsaquo; source ' + study.num;

    var links = study.dataLinks.map(function (l) {
      if (!l.url) return "<li>" + S.escapeHtml(l.label) + "</li>";
      return "<li>" + S.externalLink(l.url, l.label || S.shortHost(l.url)) + "</li>";
    }).join("");

    document.getElementById("record").innerHTML =
      "<h1>" + S.escapeHtml(study.reference) + "</h1>" +
      '<p>' + S.priorityDot(study.priority) +
        '<span class="small muted">' + S.escapeHtml(S.priorityLabel[study.priority]) +
        " &middot; " + S.escapeHtml(study.sourceType) + " &middot; " + S.escapeHtml(study.country) + "</span></p>" +
      (study.link ? "<p>" + S.externalLink(study.link, "Read the source") + "</p>" : "") +
      '<div class="record"><dl>' +
        row(S.label("topics"), study.topics.map(function (id) {
          return '<a class="tag" href="browse.html?topic=' + encodeURIComponent(id) + '">' +
            S.escapeHtml(S.topicTitle(id)) + "</a>";
        }).join("")) +
        row(S.label("healthDomain"), study.domains.map(function (d) {
          return '<a class="tag" href="browse.html?domain=' + encodeURIComponent(d) + '">' +
            S.escapeHtml(S.domainLabel(d)) + "</a>";
        }).join("")) +
        row(S.label("summary"), S.escapeHtml(study.task)) +
        row(S.label("inputs"), S.escapeHtml(study.inputData)) +
        row(S.label("outputs"), S.escapeHtml(study.output)) +
        row(S.label("measures"), S.escapeHtml(study.metrics)) +
        row(S.label("geography"), S.escapeHtml(study.geoLevel)) +
        row(S.label("geographyTags"), study.geoTags.map(function (t) {
          var full = S.tagTitle(t);
          return '<a class="tag" href="browse.html?geo=' + encodeURIComponent(t) + '"' +
            (full ? ' title="' + S.escapeHtml(full) + '"' : "") + ">" +
            S.escapeHtml(t) + "</a>";
        }).join("")) +
        row(S.label("dataSources"), S.escapeHtml(study.dataSources)) +
        row(S.label("access"), S.accessBadge(study.access) + " " +
          S.escapeHtml(study.accessNote || S.accessMeaning[study.access] || "")) +
        row(S.label("sourceLinks"), links ? "<ul>" + links + "</ul>" : "") +
        row(S.label("scale"), S.escapeHtml(study.scale)) +
        row(S.label("keyAttributes"), S.escapeHtml(study.keyAttributes)) +
      "</dl></div>" +
      '<p style="margin-top:28px"><a href="browse.html">Back to browse</a></p>';
  }).catch(function (err) {
    S.showLoadError(document.getElementById("record"), err);
  });
})();
</script>
</body>
</html>
