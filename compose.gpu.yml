# Runs the model on an NVIDIA graphics card. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f compose.gpu.yml up -d
# Needs the NVIDIA driver, and on Linux the NVIDIA Container Toolkit.
services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12242
    # Put every layer on the card. A 4B model at Q4 fits in 4 GB with a 4096 context.
    command: >
      -m /models/${MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --alias qwen/qwen3-4b-2507
      -c ${MODEL_CONTEXT:-4096} --parallel 1
      --n-gpu-layers 999
      --host 0.0.0.0 --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
