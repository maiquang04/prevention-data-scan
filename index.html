<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Draft: reachable by link, kept out of search results. Remove when it is finished. -->
<meta name="robots" content="noindex">
<title>Prevention data scan</title>
<meta name="description" content="A scan of what data already exists for measuring prevention, and how obtainable each source is.">
<link rel="stylesheet" href="assets/style.css?v=9da7681a">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="site-head__inner">
    <a class="site-head__title" href="index.html">Prevention data scan <span>&middot; working draft</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Overview</a>
      <a href="application.html?app=1">Application 1</a>
      <a href="browse.html">Browse sources</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap">

    <div class="hero">
      <h1>Prevention data scan</h1>
    </div>

    <div class="stats" id="stats" aria-live="polite">
      <p class="loading">Loading&hellip;</p>
    </div>

    <div class="buttons">
      <a class="button" href="application.html?app=1">Explore Application 1</a>
      <a class="button button--ghost" href="browse.html">Browse every source</a>
    </div>

    <section style="margin-top:44px">
      <h2>Three questions being scanned</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2>How to read this</h2>
      <div class="note">
        <ul id="access-key" style="margin:0;padding-left:0;list-style:none"></ul>
      </div>
    </section>

  </div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>Working draft &middot; last generated <span data-generated>&mdash;</span>.</p>
  </div>
</footer>

<script src="assets/common.js?v=cbf15586"></script>
<script>
(function () {
  "use strict";
  var S = window.scan;

  S.loadData(["studies.json", "meta.json"]).then(function (loaded) {
    var studies = loaded[0], meta = loaded[1];
    S.stampGenerated(meta);

    var restricted = studies.filter(function (s) { return s.access === "Restricted - application"; }).length;
    var stats = [
      [meta.total, "sources scanned"],
      [meta.withDownloadableData, "with downloadable data"],
      [restricted, "needing an application"],
      [Object.keys(meta.byApplication).length, "applications covered"]
    ];
    document.getElementById("stats").innerHTML = stats.map(function (s) {
      return '<div class="stat"><b>' + s[0] + "</b><span>" + s[1] + "</span></div>";
    }).join("");

    document.getElementById("cards").innerHTML = Object.keys(meta.byApplication).map(function (key) {
      var app = meta.byApplication[key];
      var live = key === "1";
      return '<article class="card' + (live ? "" : " card--soon") + '">' +
        "<h3>" + (live
          ? '<a href="application.html?app=' + key + '">Application ' + key + ": " + S.escapeHtml(app.title) + "</a>"
          : "Application " + key + ": " + S.escapeHtml(app.title)) + "</h3>" +
        "<p>" + S.escapeHtml(app.blurb) + "</p>" +
        '<p class="card__meta">' + app.count + " sources &middot; " +
          (live
            ? "grid view built"
            : '<a href="browse.html?app=' + key + '">listed on the browse page</a>, grid view to come') +
        "</p></article>";
    }).join("");

    document.getElementById("access-key").innerHTML = meta.accessValues.map(function (value) {
      return '<li style="margin-bottom:.5em">' + S.accessBadge(value) + " " +
        S.escapeHtml(S.accessMeaning[value]) + "</li>";
    }).join("");
  }).catch(function (err) {
    S.showLoadError(document.getElementById("stats"), err);
  });
})();
</script>
</body>
</html>
